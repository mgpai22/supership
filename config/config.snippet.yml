# Reference snippet for ~/.omp/agent/config.yml — the keys this kit relies on.
# Do NOT copy this file over your config wholesale; merge the keys (or run
# ./install.sh --config, which applies them via `omp config set`).

modelRoles:
  # ┌─ Values are YAML LISTS in availability order (first resolvable model wins;
  # │  REQUIRES omp >= 16.3.7, #4492). The `&genius`/`*genius` and `&tiny`/`*tiny`
  # │  pairs are plain YAML anchors: parse-time expansion, so omp (and this kit's
  # │  raw config reads) always see concrete lists. Do NOT use `@role` strings as
  # │  role VALUES — bare `@` breaks YAML parsing entirely, and quoted "@role"
  # │  values only expand one level in several resolver paths (dry-balance,
  # │  resolveCliModel). Anchors sidestep both.
  # └────────────────────────────────────────────────────────────────────────
  default: anthropic/claude-opus-5:high
  # cheap scouts (david-research, scout, librarian, sonic)
  smol:
    - openai-codex/gpt-5.6-luna:medium
    - anthropic/claude-haiku-4-5:medium
    - google-antigravity/gemini-3.6-flash:medium
  # GENIUS tier — one anchored list shared by slow/plan/advisor/reviewers.
  slow: &genius
    - anthropic/claude-fable-5:high
    - openai-codex/gpt-5.6-sol:xhigh
    - anthropic/claude-opus-5:xhigh
  plan: *genius
  advisor: *genius
  # mechanical workers (the task agent)
  task:
    - openai-codex/gpt-5.6-sol:medium
    - anthropic/claude-opus-5:medium
  vision:
    - google-antigravity/gemini-3.6-flash:high
    - openai-codex/gpt-5.6-terra:medium
  # session titles / classifiers; commit msgs share the same cheap chain
  tiny: &tiny
    - google-antigravity/gemini-3.1-flash-lite:medium
    - anthropic/claude-haiku-4-5:medium
    - openai-codex/gpt-5.6-luna:medium
  commit: *tiny
  designer:
    - openai-codex/gpt-5.6-sol:high
    - anthropic/claude-opus-5:high
    - zai/glm-5.2:high
  # ultra seats (/ultraship + /ultrashipit): plato = chief architect / final
  # consolidator, aristotle = challenger.
  plato:
    - anthropic/claude-fable-5:high
  aristotle:
    - openai-codex/gpt-5.6-sol:xhigh
    - anthropic/claude-opus-5:max
  # ┌─ These two are NOT fallback chains — read them differently:
  # │  • taskpool = a POOL. Cell 2 round-robins + health-checks each entry per
  # │    provider to load-balance plain `task` builders across subscriptions.
  # │    Entries MUST be concrete provider/model patterns (the kit string-parses
  # │    them; never use anchors-of-aliases or @role strings here).
  # │  • reviewers = a DIVERSITY SET. Entries ALTERNATE across review lenses
  # │    (model[i % len]) so different lenses get different eyes. An anchor to a
  # │    concrete list (like *genius) is fine — it expands at parse time.
  # └────────────────────────────────────────────────────────────────────────
  taskpool:
    - openai-codex/gpt-5.6-sol:medium
    - anthropic/claude-opus-5:medium
    - anthropic/claude-sonnet-5:high
  reviewers: *genius

task:
  # Default is 2, which tool-strips deep-debugger when a task agent spawns it
  # ad hoc (main=0 -> task=1 -> debugger=2 = AT cap -> loses its scouts).
  # /supership routes escalation at depth 0 regardless; 3 is for ad-hoc use.
  maxRecursionDepth: 3
  # Per-subagent request-count governor: omp steers the child to wrap up at the
  # budget and HARD-ABORTS it at 1.5x. The default (90 -> kill at 135) is far
  # too low for this kit's builders/debuggers, which routinely need 150+
  # requests — a real run had a deep-debugger killed at 135 in the exact
  # instant it yielded status=done (the pipeline salvages that case via
  # salvage_yield, but don't rely on it). 250 warns at 250, kills at 375.
  softRequestBudget: 250
  # Off by default, meaning children get NO warning — the first signal is the
  # kill. Turn it on so agents can wrap up and yield instead of dying mid-work.
  softRequestBudgetNotice: true

compaction:
  # snapcompact needs an omp build with the frame-payload cap (PR #3866,
  # >= v16.2.8). On older builds use 'shake' or long sessions can wedge with
  # "Anthropic Internal server error" on resume.
  strategy: snapcompact

memory:
  backend: local   # per-repo memory; consolidated ## Lessons get captured

prewalk:
  # Session-level prewalk is OFF: the main session usually orchestrates (spawns
  # subagents) rather than editing, so the one-way downgrade mostly fires never
  # (nudge spam, oh-my-pi#6174) or at the wrong time. Subagent prewalk stays on
  # via frontmatter (task -> "@smol"; designer's "@task" target is currently a
  # silent no-op when it resolves to the same model id, see oh-my-pi#6659).
  # Do NOT pass --prewalk-into via a shell wrapper: the flag ARMS prewalk by
  # itself (overrides this setting) and breaks `omp --no-prewalk`.
  enabled: false

# ┌─ NOT APPLIED BY install.sh, and deliberately so: these chains name concrete
# │  cursor/* and github-copilot/* models that only resolve where those providers
# │  are logged in. On a machine without them you get a validation warning and a
# │  dead link per entry. Copy what applies, then VERIFY every entry with
# │  `omp dry-balance <provider/id> --count 1` (prints "model:" on success).
# │  Do NOT trust `omp models` — it lists models the registry cannot resolve
# │  (github-copilot/claude-opus-5 and /gemini-3.6-flash are both in the table
# │  and both fail to resolve).
# └──────────────────────────────────────────────────────────────────────────────
# Ordering rules: (1) same model on another provider FIRST — different billing,
# so it survives a provider-wide wall while keeping model identity; (2) plentiful
# provider before scarce — a context-cliff miss costs one failed request and
# self-corrects, but Copilot premium requests don't reset for 7 days; (3) then
# same-family downgrade, then cross-family.
# NOTE: cursor bakes effort INTO the model id (claude-fable-5-max), so cursor/*
# entries take NO ":effort" suffix. Its high-effort Opus is claude-opus-5-thinking-max.
# NOTE: `default:` here auto-expands to EVERY modelRole lacking its own chain.
# retry:
#   modelFallback: true
#   fallbackChains:
#     anthropic/claude-fable-5:
#       - cursor/claude-fable-5-max
#       - github-copilot/claude-fable-5-1m:high   # 1M rescue for long sessions
#       - anthropic/claude-opus-5:max             # Fable has its OWN quota bucket
#       - cursor/claude-opus-5-thinking-max
#       - openai-codex/gpt-5.6-sol:xhigh
#       - zai/glm-5.2:max
#     anthropic/claude-opus-5:
#       - cursor/claude-opus-5-thinking-max
#       - github-copilot/claude-fable-5-1m:high
#       - openai-codex/gpt-5.6-sol:xhigh
#       - zai/glm-5.2:max
#     anthropic/claude-sonnet-5:
#       - cursor/claude-sonnet-5-high
#       - github-copilot/claude-sonnet-5-1m:high
#       - openai-codex/gpt-5.6-terra:medium
#     anthropic/claude-haiku-4-5:
#       - openai-codex/gpt-5.6-luna:medium
#       - google-antigravity/gemini-3.1-flash-lite:medium
#     default:
#       - openai-codex/gpt-5.6-sol:high
#       - anthropic/claude-opus-5:high
