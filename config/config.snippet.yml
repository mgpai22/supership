# This OMP example does not select a provider.
# Merge the selected keys into the intended configuration.
# Do not replace unrelated configuration or use global `omp config set`.
# OMP resolves @plan and @slow through the available role definitions.
task:
  agentModelOverrides:
    supership-architect: "@plan"
    supership-critic: "@slow"
    supership-judge: "@slow"

